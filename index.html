<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bde8ff">
<title>Magnet Blocks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧲%3C/text%3E%3C/svg%3E">
<style>
  :root { --btn: 52px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bde8ff;
    overscroll-behavior: none; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap;
    align-items: center; justify-content: space-between; gap: 6px 8px;
    padding: calc(env(safe-area-inset-top) + 6px) 8px 6px; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  .group { display: flex; gap: 8px; }
  button { font: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  .tool { width: var(--btn); height: var(--btn); border-radius: 16px; font-size: 28px; line-height: 1;
    background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); transition: transform .08s; padding: 0; }
  .tool:active { transform: translateY(2px) scale(.96); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .tool.on { background: #ffe27a; outline: 3px solid #fff; }
  #palette { display: flex; gap: 4px; order: 3; width: 100%; justify-content: center;
    padding: 4px; background: rgba(255,255,255,.7); border-radius: 22px; }
  .swatch { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #fff; padding: 0;
    box-shadow: 0 2px 0 rgba(0,0,0,.2); transition: transform .1s; }
  .swatch.on { transform: scale(1.22); outline: 3px solid #333; outline-offset: 1px; }
  @media (min-width: 640px) {
    #palette { order: 0; width: auto; }
    .swatch { width: 44px; height: 44px; }
  }

  #card { position: fixed; left: 8px; right: 8px; display: none; align-items: center; gap: 10px;
    flex-wrap: wrap; padding: 8px 12px; background: rgba(255,255,255,.92); border-radius: 22px;
    box-shadow: 0 4px 0 rgba(0,0,0,.15); max-width: 640px; margin: 0 auto; }
  #card.show { display: flex; }
  #card .big { font-size: 40px; line-height: 1; }
  #card h1 { margin: 0; font-size: 19px; color: #3b2f63; }
  #chips { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
  .chip { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 14px;
    background: #efe9ff; font-weight: 700; color: #3b2f63; font-size: 16px; }
  .chip { font: inherit; font-weight: 700; min-height: 44px; cursor: pointer; }
  .chip svg { width: 30px; height: 30px; }
  .chip .n { min-width: 2.2em; text-align: center; }
  .chip.done { background: #c9f5d4; }
  /* After a build is finished: a big green ➡️ showing what's next, just above the grass. */
  #next { position: fixed; right: 12px; z-index: 4; display: none; align-items: center; gap: 6px;
    padding: 10px 16px; font-size: 44px; line-height: 1; border-radius: 26px; background: #2fb65a;
    box-shadow: 0 5px 0 #1f8340, 0 0 0 6px rgba(255,255,255,.8); }
  #next.show { display: flex; animation: popIn .45s ease-out, wiggle .9s .45s infinite; }
  #next .arrow { font-size: 34px; }
  #card.won { background: #fff6c9; }
  #card h1 { flex: 1; }
  @media (max-width: 639px) {
    #chips { order: 3; flex-basis: 100%; justify-content: center; }
  }
  #cardEmoji { background: #fff; border-radius: 16px; padding: 4px 6px; position: relative;
    box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  #cardEmoji::after { content: '▾'; position: absolute; right: -2px; bottom: -4px; font-size: 14px; color: #8e4fd0; }
  #picker { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(59,47,99,.55); padding: 16px; z-index: 10; }
  #picker.show { display: flex; }
  #picker .panel { position: relative; background: #fff; border-radius: 28px; padding: 18px;
    max-width: 560px; width: 100%; box-shadow: 0 6px 0 rgba(0,0,0,.2); }
  #pickGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .pick { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 10px 4px 8px; border-radius: 20px; background: #efe9ff; font-size: 46px; line-height: 1.1;
    box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .pick span { font-size: 13px; font-weight: 700; color: #3b2f63; }
  .pick.current { outline: 4px solid #ffd23f; }
  .pick.done::after { content: '✅'; position: absolute; top: 2px; right: 4px; font-size: 18px; }
  .pick:active { transform: scale(.95); }
  #pickClose { position: absolute; top: -18px; right: -10px; width: 48px; height: 48px; font-size: 22px; }
  #score { display: flex; align-items: center; gap: 4px; height: var(--btn); padding: 0 12px 0 8px;
    border-radius: 16px; background: #fff6c9; box-shadow: 0 3px 0 rgba(0,0,0,.18);
    font-size: 22px; font-weight: 700; color: #3b2f63; font-variant-numeric: tabular-nums; }
  #score.bump { animation: bump .5s; }
  /* Points on offer for this build; lights up when it's finished. */
  #gain { padding: 6px 10px; border-radius: 14px; background: #efe9ff; color: #8a80aa;
    font-size: 18px; font-weight: 700; white-space: nowrap; }
  #card.won #gain { background: #ffd23f; color: #3b2f63; font-size: 20px; animation: bump .6s; }
  .fly { position: fixed; z-index: 5; pointer-events: none; font-size: 26px; font-weight: 700; color: #3b2f63;
    text-shadow: 0 2px 0 #fff; transition: transform .9s cubic-bezier(.5,-0.3,.7,1), opacity .9s; }
  #packTabs { display: flex; gap: 10px; justify-content: center; margin: 0 40px 14px; }
  .packTab { display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 10px; border-radius: 18px;
    background: #efe9ff; font-size: 34px; line-height: 1; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .packTab span { font-size: 15px; font-weight: 700; color: #3b2f63; }
  .packTab.on { background: #ffd23f; }
  .pick .meta { font-size: 13px; font-weight: 700; color: #6b5fa0; }
  #picker.halloween .panel { background: #2d1b4e; }
  #picker.halloween .pick { background: #4a2f73; }
  #picker.halloween .pick span, #picker.halloween .pick .meta { color: #ffd9a8; }
  /* First visit: what the two modes are and which packs there are. */
  #welcome { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(59,47,99,.55); padding: 16px; z-index: 11; }
  #welcome.show { display: flex; }
  #welcome .panel { background: #fff; border-radius: 28px; padding: 20px 18px 16px; max-width: 520px; width: 100%;
    box-shadow: 0 6px 0 rgba(0,0,0,.2); color: #3b2f63; text-align: center; animation: popIn .35s; }
  #welcome h1 { margin: 0 0 14px; font-size: 26px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 10px 12px;
    border-radius: 22px; background: #efe9ff; color: #3b2f63; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .mode.main { background: #ffe27a; }
  .mode:active { transform: scale(.96); }
  .mode b { font-size: 44px; line-height: 1.1; }
  .mode span { font-size: 18px; font-weight: 700; }
  .mode small { font-size: 13px; line-height: 1.3; color: #6b5fa0; }
  .packs { margin: 14px 0 0; font-size: 15px; line-height: 1.6; }
  .packs b { display: block; font-size: 13px; color: #8a80aa; text-transform: uppercase; letter-spacing: .04em; }
  .packs.soon { margin-top: 8px; color: #8a80aa; }
  @keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.15); } }
  @keyframes bump { 40% { transform: scale(1.3); } }
  @keyframes wiggle { 50% { transform: scale(1.1) rotate(-3deg); } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Magnet Blocks play area"></canvas>

<div id="bar">
  <div class="group">
    <button id="btnChallenge" class="tool" aria-label="Challenges" title="Challenges">🎯</button>
    <button id="btnFree" class="tool" aria-label="Free build" title="Free build">🎨</button>
    <div id="score" role="status" aria-label="Score" title="Score">🏆<span id="scoreN">0</span></div>
  </div>
  <div id="palette" role="group" aria-label="Colors"></div>
  <div class="group">
    <button id="btnHelp" class="tool" aria-label="About the game" title="About the game">❓</button>
    <button id="btnClear" class="tool" aria-label="Clear everything" title="Clear">🧹</button>
    <button id="btnSound" class="tool" aria-label="Sound on/off" title="Sound">🔊</button>
  </div>
</div>

<div id="card" role="status">
  <button class="big" id="cardEmoji" aria-label="Choose what to build"></button>
  <h1 id="cardTitle"></h1>
  <div id="chips"></div>
  <div id="gain"></div>
</div>
<button id="next" aria-label="Next challenge"><span class="arrow">➡️</span><span id="nextEmoji"></span></button>

<!-- ?v= is stamped with the commit on deploy so phones never mix old and new files -->
<div id="picker" role="dialog" aria-label="Choose what to build">
  <div class="panel">
    <div id="packTabs" role="tablist" aria-label="Themes"></div>
    <div id="pickGrid"></div>
    <button id="pickClose" class="tool" aria-label="Close">✖️</button>
  </div>
</div>

<div id="welcome" role="dialog" aria-label="Welcome to Magnet Blocks">
  <div class="panel">
    <h1>🧲 Magnet Blocks</h1>
    <div class="modes">
      <button id="welcomeChallenge" class="mode main"><b>🎯</b><span>Challenges</span>
        <small>Build the picture on the card. Score points and finish whole packs.</small></button>
      <button id="welcomeFree" class="mode"><b>🎨</b><span>Free build</span>
        <small>Build anything you like with every block in the box.</small></button>
    </div>
    <p class="packs"><b>Packs</b><span id="welcomePacks"></span></p>
    <p class="packs soon"><b>Coming soon</b>🎄 Christmas · 🚗 Vehicles</p>
  </div>
</div>

<script src="geometry.js?v=dev"></script>
<script src="game.js?v=dev"></script>
</body>
</html>
